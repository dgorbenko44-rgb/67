<title>67</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{background:radial-gradient(circle at 50% 42%,#3b2700 0,#100b00 30%,#020202 72%);color:#ffd21a;font-family:Arial Black,Arial,sans-serif}.stage{position:relative;width:100vw;height:100vh;display:grid;place-items:center;overflow:hidden}.glow{position:absolute;width:55vmin;height:55vmin;border-radius:50%;background:#ffbd00;filter:blur(90px);opacity:.13}.content{position:relative;width:min(1000px,94vw);height:min(800px,94vh);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;perspective:900px}.nums{font-size:clamp(160px,31vw,410px);line-height:.72;letter-spacing:-.09em;font-weight:900;color:#ffc400;text-shadow:0 4px 0 #b47700,0 8px 0 #805000,0 12px 0 #543400,0 0 8px #fff1a0,0 0 28px #ffc400,0 0 70px rgba(255,180,0,.6);transform-style:preserve-3d;animation:float 3s ease-in-out infinite,spin 8s ease-in-out infinite;filter:drop-shadow(0 28px 18px rgba(0,0,0,.7))}@keyframes float{0%,100%{transform:translateY(0) rotateY(-10deg) rotateX(3deg)}50%{transform:translateY(-18px) rotateY(10deg) rotateX(-3deg)}}@keyframes spin{0%,100%{scale:1}50%{scale:1.025}}.hands{display:flex;gap:clamp(45px,13vw,170px);margin-top:10px}.hand{width:clamp(130px,18vw,220px);height:clamp(100px,13vw,155px);position:relative;animation:updown 1.8s ease-in-out infinite;filter:drop-shadow(0 0 12px #ffc400) drop-shadow(0 15px 12px rgba(0,0,0,.6))}.hand.right{animation-delay:-.9s}@keyframes updown{0%,100%{transform:translateY(12px) rotate(-2deg)}50%{transform:translateY(-24px) rotate(2deg)}}.palm{position:absolute;left:17%;top:25%;width:66%;height:65%;background:linear-gradient(145deg,#ffe35a,#f2a800);border:4px solid #ffd21a;border-radius:45% 45% 48% 48%;transform:rotate(-4deg)}.right .palm{transform:rotate(4deg)}.finger{position:absolute;width:28%;height:62%;top:12%;background:linear-gradient(145deg,#ffe35a,#e99b00);border:4px solid #ffd21a;border-radius:50%;transform-origin:bottom}.f1{left:0;transform:rotate(-38deg)}.f2{left:20%;top:2%;transform:rotate(-20deg)}.f3{left:40%;top:0;transform:rotate(-5deg)}.f4{left:60%;top:7%;transform:rotate(12deg)}.right .f1{left:60%;transform:rotate(38deg)}.right .f2{left:40%;transform:rotate(20deg)}.right .f3{left:20%;transform:rotate(5deg)}.right .f4{left:0;transform:rotate(-12deg)}.thumb{position:absolute;width:38%;height:35%;top:48%;background:#f4ae13;border:4px solid #ffd21a;border-radius:50%;transform:rotate(-30deg)}.right .thumb{right:0;transform:rotate(30deg)}.spark{position:absolute;border-radius:50%;background:#fff2a3;box-shadow:0 0 12px #ffc400;animation:blink 1.4s infinite}@keyframes blink{50%{opacity:.15;transform:scale(.4)}}.s1{width:5px;height:5px;left:18%;top:20%}.s2{width:7px;height:7px;right:17%;top:28%;animation-delay:.4s}.s3{width:4px;height:4px;left:24%;bottom:18%;animation-delay:.8s}.s4{width:6px;height:6px;right:27%;bottom:15%;animation-delay:.2s}.label{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);font-family:Arial,sans-serif;font-weight:700;font-size:14px;color:#ffe78a;opacity:.7;letter-spacing:3px;text-transform:uppercase}
</style></head><body><div class="stage"><div class="glow"></div><div class="spark s1"></div><div class="spark s2"></div><div class="spark s3"></div><div class="spark s4"></div><div class="content"><div class="nums">67</div><div class="hands"><div class="hand"><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div><div class="palm"></div><div class="thumb"></div></div><div class="hand right"><div class="finger f1"></div><div class="finger f2"></div><div class="finger f3"></div><div class="finger f4"></div><div class="palm"></div><div class="thumb"></div></div></div></div><div class="label">67</div></div></body></html>
